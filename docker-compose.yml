# Dev-only compose: runs the frontend Vite dev server, Go backend, and Postgres.
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      # Bind-mount source for HMR...
      - ./frontend:/app
      # ...but keep the image's node_modules (host installs are platform-specific).
      - frontend_node_modules:/app/node_modules
    environment:
      # Vite already binds 0.0.0.0:5173 (see frontend/vite.config.ts).
      # Set CHOKIDAR_USEPOLLING=true if HMR misses changes (Docker Desktop / VM).
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-false}"
      # Container-to-container: proxy /api to the backend service, not localhost.
      VITE_PROXY_TARGET: "http://backend:8080"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Container-to-container: use the db service name and internal port 5432, not localhost:5433.
      DB_URL: "postgres://devuser:devpassword@db:5432/music_db?sslmode=disable"
      # Dev-only fallback so `docker compose up` works out of the box without crashing.
      JWT_SECRET: "${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}"
      JWT_EXPIRY_HOURS: "${JWT_EXPIRY_HOURS:-24}"
      REFRESH_TOKEN_TTL_HOURS: "${REFRESH_TOKEN_TTL_HOURS:-168}"
      BCRYPT_COST: "${BCRYPT_COST:-10}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: music_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d music_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  pgdata: